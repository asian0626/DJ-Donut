services:
  # Discord Music Bot Multi-Room Cluster
  music-bot:
    build: .
    container_name: discord-music-bot-cluster
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:${METRICS_PORT:-8080}:8080"
    depends_on:
      - lavalink

  # Optional: Embedded High-Performance Lavalink v4 Audio Node
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink-audio-node
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx1G
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:?Please set LAVALINK_PASSWORD in .env}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "127.0.0.1:2333:2333"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2333/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
